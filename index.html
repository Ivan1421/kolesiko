<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Колесо фортуны 🎡 — DFL Ultimate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800;14..32,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🎡 Колесо <span class="accent">фортуны</span></h1>

  <div class="app">
    <div class="wheel-wrap">
      <canvas id="wheel" width="480" height="480"></canvas>
      <div class="pointer">▼</div>
    </div>

    <div class="panel">
      <h2>Варианты</h2>
      <div id="sectors" class="sectors"></div>

      <button id="addBtn" class="btn-add">+ Добавить вариант</button>
      <div class="sum-info">Сумма: <span id="sum">100</span>%</div>
      <button id="spinBtn" class="btn-spin">Крутить!</button>
      <p id="result" class="result"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
